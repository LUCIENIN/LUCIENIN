name: Refresh latest projects

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Refresh latest public projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          PROFILE_REPOSITORY: ${{ github.event.repository.name }}
        run: node .github/scripts/update-projects.mjs

      - name: Commit refreshed projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh latest projects" || exit 0
          git push
