<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LUCIENIN profile header</title>
  <desc id="desc">A cosmic laboratory banner representing AI, creative code and edge devices.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="22" x2="1160" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B1D"/>
      <stop offset="0.48" stop-color="#23164F"/>
      <stop offset="1" stop-color="#6236B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(958 78) rotate(142) scale(425 344)">
      <stop stop-color="#B99CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="775" y1="55" x2="1120" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#DDD6FE" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#02040F" flood-opacity="0.75"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="30" fill="url(#glow)"/>

  <g fill="#DDD6FE">
    <circle cx="78" cy="62" r="2.5" opacity="0.78"/>
    <circle cx="172" cy="276" r="2" opacity="0.54"/>
    <circle cx="286" cy="42" r="1.7" opacity="0.8"/>
    <circle cx="646" cy="282" r="2.2" opacity="0.52"/>
    <circle cx="1090" cy="54" r="2.2" opacity="0.82"/>
    <circle cx="1142" cy="238" r="2.5" opacity="0.66"/>
  </g>

  <g transform="translate(930 167)" stroke="url(#orbit)" fill="none">
    <ellipse rx="175" ry="76" stroke-width="1.5" transform="rotate(-18)"/>
    <ellipse rx="151" ry="58" stroke-width="1.2" transform="rotate(48)"/>
    <circle r="61" stroke-width="1.5" stroke-dasharray="5 7"/>
  </g>

  <circle cx="930" cy="167" r="24" fill="#C4B5FD" opacity="0.24" filter="url(#softGlow)"/>
  <circle cx="930" cy="167" r="8" fill="#F5F3FF"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="650" text-anchor="middle">
    <g transform="translate(825 84)">
      <circle r="20" fill="#11172F" stroke="#A78BFA"/>
      <text y="5" fill="#DDD6FE" font-size="13">AI</text>
    </g>
    <g transform="translate(1077 158)">
      <circle r="20" fill="#11172F" stroke="#60A5FA"/>
      <text y="5" fill="#DBEAFE" font-size="13">UX</text>
    </g>
    <g transform="translate(860 264)">
      <circle r="23" fill="#11172F" stroke="#C084FC"/>
      <text y="5" fill="#F3E8FF" font-size="12">EDGE</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="82" y="149" fill="#FFFFFF" font-size="66" font-weight="780" letter-spacing="2">LUCIENIN</text>
    <text x="85" y="197" fill="#CFC4EE" font-size="21" font-weight="520" letter-spacing="3">AI · CREATIVE CODE · EDGE DEVICES</text>
    <text x="84" y="241" fill="#AFA5CA" font-size="17" font-weight="430" letter-spacing="0.6">From playful ideas to working systems.</text>
  </g>

  <path d="M0 301C181 270 333 334 548 302C776 268 967 276 1200 309V340H0V301Z" fill="#FFFFFF" fill-opacity="0.055"/>
</svg>
